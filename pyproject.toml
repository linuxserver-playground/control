[project]
name = "lsio-control"
version = "0.1.0"
description = "The LinuxServer.io v2 playground CI control plane: GitHub App, webhook intake, Discord notifications."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
  "cryptography==50.0.2",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "pydantic==2.14.1",
  "pyjwt==2.15.1",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
  "anyio==4.15.1",
  "httpx2==2.16.0",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "ruff==0.17.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["control"]

[tool.setuptools.package-data]
control = ["templates/*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
