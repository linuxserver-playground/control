---
# Labs control (workspace docs/labs.md): the same image as ~/control, for linuxserverlabs-playground.
services:
  control-labs:
    image: ghcr.io/linuxserver-playground/control:latest
    container_name: control-labs
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    # GITHUB_ORG, CONTROL_PUBLIC_URL, SITE_URL, HUB_URL and the secrets; mode 600, never committed
    env_file: /home/thelamer/control-labs/.env
    volumes:
      - /home/thelamer/control-labs/config:/config
    # no published ports: SWAG proxies labs-ci.* to control-labs:8080 over the shared network
    networks:
      - sealskin-demo

  updater:
    # Every 5 minutes pull control:latest and recreate control-labs only when the digest changed.
    image: docker:29-cli
    container_name: control-labs-updater
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        while true; do
          docker compose -p control-labs -f /home/thelamer/control-labs/compose.yml pull -q control-labs &&
            docker compose -p control-labs -f /home/thelamer/control-labs/compose.yml up -d control-labs
          sleep 300
        done
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/thelamer/control-labs:/home/thelamer/control-labs:ro

networks:
  sealskin-demo:
    external: true
