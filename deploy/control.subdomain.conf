## Version 2026/11/02
# An example SWAG proxy conf for control: control.<your domain> to the control container on port 8080.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name control.*;
    include /config/nginx/ssl.conf;
    client_max_body_size 0;
    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app control;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
        # off for the live status stream (/api/stream)
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
