## Version 2026/10/24
# control (LinuxServer CI control plane). Drop next to the other site confs in swag's proxy-confs.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ci.*;
    include /config/nginx/ssl.conf;
    client_max_body_size 0;
    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app control;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
        # off for the SSE status feed that comes in a later increment
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
