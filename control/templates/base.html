<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}control{% endblock %}</title>
<style>
  :root { color-scheme: dark light; --bg: #0f1216; --fg: #e6e8eb; --muted: #8b949e; --line: #2a3139; --ok: #3fb950; --warn: #d29922; --accent: #58a6ff; }
  @media (prefers-color-scheme: light) { :root { --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #d0d7de; } }
  body { margin: 0; padding: 1.5rem; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; max-width: 72rem; margin-inline: auto; }
  h1 { font-size: 1.4rem; margin: 0 0 1rem; }
  h2 { font-size: 1.05rem; margin: 2rem 0 .5rem; color: var(--muted); font-weight: 600; }
  a { color: var(--accent); }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .35rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  code { font-family: ui-monospace, monospace; font-size: .9em; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .3rem 1.2rem; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .muted { color: var(--muted); }
  button { font: inherit; padding: .5rem 1rem; border-radius: 6px; border: 1px solid var(--line); background: var(--accent); color: #0f1216; cursor: pointer; }
  footer { margin-top: 3rem; color: var(--muted); font-size: .85em; }
</style>
</head>
<body>
{% block body %}{% endblock %}
<footer>lsio-control {{ version | default("") }}</footer>
</body>
</html>
